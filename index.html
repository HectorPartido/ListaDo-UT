<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ListaDo · Tareas de la universidad</title>
<meta name="description" content="Gestor de tareas, entregas, exámenes y horario de la universidad. Funciona sin conexión y se sincroniza entre tus dispositivos.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='17' rx='3.5'/><path d='m8 12.5 2.6 2.6L16.5 9'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app hidden" id="app">
  <div class="scrim" data-app="close-menu"></div>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" data-icon="list-checks" aria-hidden="true"></span>
      <div class="brand-text">
        <strong>ListaDo</strong>
        <small>Tareas de la uni</small>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="sb-title">Datos</div>
      <div class="sb-actions">
        <button class="btn btn-ghost btn-sm" data-app="export"><span data-icon="download"></span> Exportar</button>
        <button class="btn btn-ghost btn-sm" data-app="import"><span data-icon="upload"></span> Importar</button>
        <button class="btn btn-ghost btn-sm is-danger" data-app="reset"><span data-icon="trash"></span> Borrar todo</button>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button class="btn btn-sm install-btn hidden" id="install-btn">
        <span data-icon="download"></span> Instalar la app
      </button>
      <p class="sb-hint">
        <kbd>N</kbd> nueva tarea · <kbd>/</kbd> buscar · <kbd>1</kbd>–<kbd>8</kbd> vistas
      </p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-icon only-mobile" data-app="menu" data-icon="menu" aria-label="Abrir menú"></button>
      <label class="search">
        <span class="s-ico" data-icon="search" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Buscar tareas, asignaturas, notas…" autocomplete="off" aria-label="Buscar">
      </label>
      <div class="topbar-actions">
        <span id="sync-status" class="sync-pill hidden" role="status"></span>
        <button class="btn btn-ghost btn-icon" data-app="theme" title="Cambiar tema" aria-label="Cambiar tema"></button>
        <button class="btn btn-primary" data-app="new-task"><span data-icon="plus"></span> <span class="txt">Nueva tarea</span></button>
      </div>
    </header>

    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>

<!-- Puerta de entrada: se muestra mientras no haya sesión -->
<div id="gate" class="gate hidden"></div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/importers.js"></script>
<script src="js/api.js"></script>
<script src="js/sync.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/modals.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/schedule.js"></script>
<script src="js/views/subjects.js"></script>
<script src="js/views/team.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/views/group.js"></script>
<script src="js/app.js"></script>
</body>
</html>
