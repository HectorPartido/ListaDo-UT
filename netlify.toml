# =============================================================================
#  ListaDo · configuración de Netlify
# =============================================================================
#  No hay paso de compilación: se publican los archivos tal cual.
#  Las mismas cabeceras están en servidor.py, para que probar en local sea
#  equivalente a lo que se sirve en producción.
# =============================================================================

[build]
  publish = "."
  command = ""

# ---- Seguridad, para todo el sitio ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # La app sólo carga scripts de sí misma y de jsdelivr (supabase-js), y sólo
    # habla con Supabase. Los `style="..."` del HTML obligan a 'unsafe-inline'
    # en estilos; no hay ni un script en línea.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"

# ---- El armazón se revalida siempre: así los cambios llegan al momento ----
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Los iconos no cambian ----
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
